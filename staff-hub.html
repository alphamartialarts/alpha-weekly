<script>
(function(){var P=JSON.parse(document.getElementById('payload').textContent);function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
var K='hub-pw';function open(pw,auto){var enc=new TextEncoder();return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct))}).then(function(buf){var html=new TextDecoder().decode(buf);document.open();document.write(html);document.close()})}
var saved=null;try{saved=localStorage.getItem(K)}catch(e){}
if(saved){open(saved,true).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var pw=document.getElementById('pw').value,rem=document.getElementById('rem').checked,err=document.getElementById('err');err.textContent='';
 if(rem){try{localStorage.setItem(K,pw)}catch(x){}}open(pw).catch(function(){try{localStorage.removeItem(K)}catch(x){}err.textContent='That password is not correct.'})});})();
